<style>
body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: sans-serif;
}

.wrapper {
    position: relative;
    width: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.gateway {
    width: 100%;
    height: 100%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 10;
}

.gateway img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.gateway::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: #fe6081;
    width: 60px;
    height: 60px;
    background-image: url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgZmlsbD0iI2ZmZiI+PHBhdGggZD0iTTYgNHYxNmwxMi04eiIvPjwvc3ZnPg==);
    background-position: center;
    background-repeat: no-repeat;
    background-size: 28px;
    box-shadow: 0 0 20px rgba(254, 96, 129, 0.7);
}

#player_api {
    width: 100%;
    height: 100%;
    display: none;
    background: #000;
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- THUMBNAIL -->
    <div class="gateway" id="trigger-point">
        <img src="thumbche12.jpg" alt="Preview">
    </div>

    <!-- VIDEO -->
    <video id="player_api" controls playsinline preload="auto"></video>

</div>

<script>
(function() {

    // ===== IKLAN =====
    const monetag_direct = "https://omg10.com/4/10545080";
    const adsterra_direct = "https://peacockvowel.com/rv20awf8b2?key=191bb6a4601dfa68d11a3420ac6a47e2";

    const videy_url = "https://cdn2.videy.co/SC7qRVbo1.mp4";

    const btn = document.getElementById('trigger-point');
    const vid = document.getElementById('player_api');

    let country = "ID";
    let geoReady = false;

    let directShown = false;
    let midShown = false;
    let adCount = 0;
    const maxAds = 4;

    // ===== GEO CEPAT =====
    fetch('https://ipwho.is/')
    .then(res => res.json())
    .then(data => {
        country = data.country_code || "ID";
        geoReady = true;
    })
    .catch(() => {
        geoReady = true;
    });

    function getDirectLink() {
        return (country === "ID") ? monetag_direct : adsterra_direct;
    }

    function showAd() {
        if (!geoReady) return; // penting: tunggu GEO

        if (adCount < maxAds) {
            window.open(getDirectLink(), '_blank');
            adCount++;
        }
    }

    // ===== KLIK THUMBNAIL =====
    btn.addEventListener('click', function() {

        // popunder tetap jalan otomatis

        btn.style.display = 'none';
        vid.style.display = 'block';

        vid.src = videy_url;
        vid.play();
    });

    // ===== KLIK VIDEO =====
    vid.addEventListener('click', function() {
        if (!directShown) {
            showAd();
            directShown = true;
        }
    });

    // ===== MID VIDEO =====
    vid.addEventListener('timeupdate', function() {
        if (vid.currentTime > 20 && !midShown) {
            showAd();
            midShown = true;
        }
    });

    // ===== ANTI SKIP =====
    let lastTime = 0;
    vid.addEventListener('timeupdate', function() {
        if (vid.currentTime - lastTime > 5) {
            showAd();
        }
        lastTime = vid.currentTime;
    });

})();
</script>
